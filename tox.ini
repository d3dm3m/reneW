[tox]
envlist = py310, py311, lint, format

[testenv]
description = Run functional tests via run_tests.py
deps =
    pytest
    qgis
commands =
    pytest run_tests.py

[testenv:lint]
description = Run flake8 linting
skip_install = true
deps = flake8
commands = flake8 reneW run_tests.py tests --max-line-length 88 --ignore E203,W503,E402

[testenv:format]
description = Check code formatting with black
skip_install = true
deps = black
commands = black --check .

[testenv:format-fix]
description = Auto-format code with black
skip_install = true
deps = black
commands = black .

[testenv:isort]
description = Sort imports with isort
skip_install = true
deps = isort
commands = isort .
